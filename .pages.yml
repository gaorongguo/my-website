media:
  - name: "images"
    label: "图片库"
    input: "images"
    output: "/images"
    extensions: ["jpg", "jpeg", "png", "webp", "gif"]
    rename: "random"
content:
  - name: "site"
    label: "网站内容"
    type: "file"
    path: "content.json"
    format: "json"
    operations:
      rename: false
      delete: false
    fields:
      - name: "siteName"
        label: "网站名称（中文）"
        type: "string"
      - name: "siteNameEn"
        label: "网站名称 English"
        type: "string"
      - name: "homePage"
        label: "首页显示哪一页（填页面的「网址标识」，默认 cv）"
        type: "string"
      - name: "style"
        label: "全站样式（所有页面默认用这个；网站名称、菜单、正文的字体字号颜色都在这里）"
        type: "object"
        fields:
          - name: "font"
            label: "【正文】字体"
            type: "select"
            options:
              values:
                - name: "sans"
                  label: "黑体 / 无衬线（默认）"
                - name: "serif"
                  label: "宋体 / 衬线"
                - name: "kai"
                  label: "楷体"
                - name: "mono"
                  label: "等宽"
          - name: "fontSize"
            label: "【正文】字号（像素，如 12）"
            type: "number"
          - name: "lineHeight"
            label: "【正文】行距（倍数，如 1.8）"
            type: "number"
          - name: "color"
            label: "【正文】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "textAlign"
            label: "【正文】对齐方式"
            type: "select"
            options:
              values:
                - name: "justify"
                  label: "两端对齐（整齐，默认）"
                - name: "left"
                  label: "左对齐"
                - name: "center"
                  label: "居中"
                - name: "right"
                  label: "右对齐"
          - name: "titleFont"
            label: "【页面标题】字体"
            type: "select"
            options:
              values:
                - name: "sans"
                  label: "黑体 / 无衬线（默认）"
                - name: "serif"
                  label: "宋体 / 衬线"
                - name: "kai"
                  label: "楷体"
                - name: "mono"
                  label: "等宽"
          - name: "titleSize"
            label: "【页面标题】字号（像素）"
            type: "number"
          - name: "titleColor"
            label: "【页面标题】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "captionSize"
            label: "【图片说明】字号（像素）"
            type: "number"
          - name: "captionColor"
            label: "【图片说明】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "nameFont"
            label: "【网站名称】字体"
            type: "select"
            options:
              values:
                - name: "sans"
                  label: "黑体 / 无衬线（默认）"
                - name: "serif"
                  label: "宋体 / 衬线"
                - name: "kai"
                  label: "楷体"
                - name: "mono"
                  label: "等宽"
          - name: "nameSize"
            label: "【网站名称】字号（像素，如 13）"
            type: "number"
          - name: "nameColor"
            label: "【网站名称】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "nameWeight"
            label: "【网站名称】粗细"
            type: "select"
            options:
              values:
                - name: "normal"
                  label: "常规"
                - name: "bold"
                  label: "加粗"
          - name: "menuFont"
            label: "【左侧菜单】字体"
            type: "select"
            options:
              values:
                - name: "sans"
                  label: "黑体 / 无衬线（默认）"
                - name: "serif"
                  label: "宋体 / 衬线"
                - name: "kai"
                  label: "楷体"
                - name: "mono"
                  label: "等宽"
          - name: "menuSize"
            label: "【左侧菜单】字号（像素）"
            type: "number"
          - name: "menuColor"
            label: "【左侧菜单】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "menuActive"
            label: "【左侧菜单】当前页颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "sectionSize"
            label: "【板块标题】字号（像素；指菜单里的 作品、文本 等）"
            type: "number"
          - name: "sectionColor"
            label: "【板块标题】颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "background"
            label: "【页面】背景色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "linkColor"
            label: "【页面】链接颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "linkHover"
            label: "【页面】鼠标移上去的链接颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "imageWidth"
            label: "【页面】作品图片区最大宽度（像素，如 640）"
            type: "number"
          - name: "gridWidth"
            label: "【页面】缩略图最大宽度（像素，如 220）"
            type: "number"
          - name: "autoTrim"
            label: "【页面】自动裁掉图片四周的白边（让图片顶端和文字对齐）"
            type: "select"
            options:
              values:
                - name: "yes"
                  label: "是（默认）"
                - name: "no"
                  label: "否（保持原样）"
      - name: "sections"
        label: "板块（左侧菜单的大标题，可随时添加；每一项后面的「显示/隐藏」表示当前状态）"
        type: "object"
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {title}　{status}"
        fields:
          - name: "title"
            label: "板块名称（中文）"
            type: "string"
          - name: "titleEn"
            label: "板块名称 English（选填）"
            type: "string"
          - name: "status"
            label: "显示状态（选「隐藏」=暂时不在网站上出现，随时可改回）"
            type: "select"
            default: "显示"
            options:
              values:
                - name: "显示"
                  label: "显示"
                - name: "隐藏"
                  label: "隐藏（暂时不显示）"
          - name: "style"
            label: "这个板块的样式（选填）"
