media:
  - name: "images"
    label: "图片库"
    input: "images"
    output: "/images"
    extensions: ["jpg", "jpeg", "png", "webp", "gif"]
    rename: "random"
content:
  - name: "site"
    label: "网站内容"
    type: "file"
    path: "content.json"
    format: "json"
    operations:
      rename: false
      delete: false
    fields:
      - name: "siteName"
        label: "网站名称（中文）"
        type: "string"
      - name: "siteNameEn"
        label: "网站名称 English"
        type: "string"
      - name: "style"
        label: "全站样式（所有页面默认用这个）"
        type: "object"
        fields:
          - name: "font"
            label: "字体"
            type: "select"
            options:
              values:
                - name: "sans"
                  label: "黑体 / 无衬线（默认）"
                - name: "serif"
                  label: "宋体 / 衬线"
                - name: "kai"
                  label: "楷体"
                - name: "mono"
                  label: "等宽"
          - name: "fontSize"
            label: "正文字号（像素，如 12）"
            type: "number"
          - name: "lineHeight"
            label: "行距（倍数，如 1.8）"
            type: "number"
          - name: "color"
            label: "正文颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "background"
            label: "背景色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "titleSize"
            label: "标题字号（像素）"
            type: "number"
          - name: "titleColor"
            label: "标题颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "captionSize"
            label: "图片说明字号（像素）"
            type: "number"
          - name: "captionColor"
            label: "图片说明颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "linkColor"
            label: "链接颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "imageWidth"
            label: "作品图片区最大宽度（像素，如 640）"
            type: "number"
          - name: "gridWidth"
            label: "缩略图最大宽度（像素，如 220）"
            type: "number"
          - name: "linkHover"
            label: "鼠标移上去的链接颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "menuSize"
            label: "左侧菜单字号（像素）"
            type: "number"
          - name: "menuColor"
            label: "左侧菜单颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
          - name: "menuActive"
            label: "左侧菜单当前项颜色"
            type: "string"
            description: "颜色写法：#333333 或 red；留空=跟随上一级"
      - name: "sections"
        label: "板块（左侧菜单的大标题，可随时添加）"
        type: "object"
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: "title"
            label: "板块名称（中文）"
            type: "string"
          - name: "titleEn"
            label: "板块名称 English（选填）"
            type: "string"
          - name: "style"
            label: "这个板块的样式（选填）"
            type: "object"
            fields:
              - name: "font"
                label: "字体"
                type: "select"
                options:
                  values:
                    - name: "sans"
                      label: "黑体 / 无衬线（默认）"
                    - name: "serif"
                      label: "宋体 / 衬线"
                    - name: "kai"
                      label: "楷体"
                    - name: "mono"
                      label: "等宽"
              - name: "fontSize"
                label: "正文字号（像素，如 12）"
                type: "number"
              - name: "lineHeight"
                label: "行距（倍数，如 1.8）"
                type: "number"
              - name: "color"
                label: "正文颜色"
                type: "string"
                description: "颜色写法：#333333 或 red；留空=跟随上一级"
              - name: "background"
                label: "背景色"
                type: "string"
                description: "颜色写法：#333333 或 red；留空=跟随上一级"
              - name: "titleSize"
                label: "标题字号（像素）"
                type: "number"
              - name: "titleColor"
                label: "标题颜色"
                type: "string"
                description: "颜色写法：#333333 或 red；留空=跟随上一级"
              - name: "captionSize"
                label: "图片说明字号（像素）"
                type: "number"
              - name: "captionColor"
                label: "图片说明颜色"
                type: "string"
                description: "颜色写法：#333333 或 red；留空=跟随上一级"
              - name: "linkColor"
                label: "链接颜色"
                type: "string"
                description: "颜色写法：#333333 或 red；留空=跟随上一级"
              - name: "imageWidth"
                label: "作品图片区最大宽度（像素，如 640）"
                type: "number"
              - name: "gridWidth"
                label: "缩略图最大宽度（像素，如 220）"
                type: "number"
          - name: "pages"
            label: "直接放在这个板块下的页面"
            type: "object"
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {title}"
            fields:
              - name: "title"
                label: "页面名称（中文）"
                type: "string"
              - name: "titleEn"
                label: "页面名称 English（选填）"
                type: "string"
              - name: "slug"
                label: "网址标识（选填，英文或拼音，如 twins）"
                type: "string"
              - name: "layout"
                label: "显示方式"
                type: "select"
                options:
                  values:
                    - name: "slideshow"
                      label: "一张一张看（图下带 ← → 和 1/5）"
                    - name: "grid"
                      label: "缩略图平铺（每张图下带说明）"
              - name: "images"
                label: "图片（可随时添加；一页有 2 张以上会出现翻页箭头）"
                type: "object"
                list:
                  collapsible:
                    collapsed: true
                    summary: "图片 {index}　{caption}"
                fields:
                  - name: "src"
                    label: "图片"
                    type: "image"
                    options:
                      media: "images"
                  - name: "caption"
                    label: "图片说明（显示在这张图正下方）"
                    type: "string"
                  - name: "captionEn"
                    label: "图片说明 English（选填）"
                    type: "string"
              - name: "text"
                label: "正文（空一行=新段落；链接写成 [文字](网址)，网址和邮箱会自动变链接）"
                type: "text"
              - name: "textEn"
                label: "正文 English（选填，网站切到英文时显示）"
                type: "text"
              - name: "style"
                label: "这一页的样式（选填，留空=跟随上一级）"
