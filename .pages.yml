# 精简版配置：Pages CMS 只当「图片库」用。
# 网站内容请用网站编辑器：https://www.gaorongguo.com/admin.html
media:
  - name: "images"
    label: "图片库"
    input: "images"
    output: "/images"
    extensions: ["jpg", "jpeg", "png", "webp", "gif"]
    rename: "random"
content:
  - name: "robots"
    label: "robots.txt（一般不用动）"
    type: "file"
    path: "robots.txt"
settings:
  hide: true
