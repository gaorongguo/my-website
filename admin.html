 var fam=c.fontFamily.split(',')[0].replace(/["']/g,'').trim(),nm='';fl.forEach(function(f){if(f[1].split(',')[0].replace(/["']/g,'').trim().toLowerCase()==fam.toLowerCase())nm=f[0]});$('#ff').options[0].text='字体 '+(nm||fam)}
document.addEventListener('selectionchange',sync);
function hh(){document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px')}hh();addEventListener('resize',hh);
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()=='s'){e.preventDefault();save()}});
$('#fc').onchange=function(){ex('foreColor',this.value)};$('#bc').onchange=function(){ex('hiliteColor',this.value)};
$('#lk').onclick=function(){var u=prompt('链接网址（以 https:// 开头）','https://');if(u)ex('createLink',u)};
area.addEventListener('input',function(){dirty=true});
area.addEventListener('paste',function(e){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
function firstPage(){var r=null;D.sections.forEach(function(s){(s.pages||[]).concat.apply(s.pages||[],(s.categories||[]).map(function(c){return c.pages||[]})).forEach(function(p){if(!r||String(p.slug).toLowerCase()=='cv'&&String(r.slug).toLowerCase()!='cv')r=p})});return r}
function load(){msg('读取中…');var q=(C.tok&&C.repo)?gh('GET').then(function(j){sha=j.sha;return unb64(j.content)}):fetch('content.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()});
 return q.then(function(t){D=JSON.parse(t);D.sections=D.sections||[];cur=firstPage();render();msg(C.tok?'已连接：'+C.repo+'。先在左边选一个页面，再选中文字，用上面的工具栏设置。':'未连接 GitHub：改完只能点「下载备份」再手动上传。')}).catch(err)}
function save(){commit();if(!(C.tok&&C.repo))return msg('还没连接 GitHub：请点「设置」，或用「下载备份」。',1);msg('保存中…');
 gh('PUT',{message:'Update content.json (editor)',content:b64(JSON.stringify(D,null,1)),sha:sha}).then(function(j){sha=j.content.sha;dirty=false;msg('已保存并发布，约 1 分钟后网站更新（看不到变化就按 Ctrl+F5）。')}).catch(err)}
$('#pst').onchange=function(){if(cur){cur.showTitle=this.value;dirty=true}};
$('#pla').onchange=function(){if(cur){cur.layout=this.value;dirty=true}};
$('#nav').onclick=function(){commit();$('#dl').click();
 var S=D.sections,all=[],log=[],made={};
 S.forEach(function(s){(s.pages||[]).forEach(function(p){all.push({p:p,s:s,a:s.pages})});(s.categories||[]).forEach(function(c){(c.pages||[]).forEach(function(p){all.push({p:p,s:s,a:c.pages})})})});
 function loc(sl,re){return all.filter(function(x){return sl.indexOf(String(x.p.slug||'').toLowerCase())>=0||re.test((x.p.title||'')+' '+(x.p.titleEn||''))})[0]}
 [['ex',['views'],/installation|现场|exhibition/i,'展览','Exhibitions','gallery'],['pr',['press'],/press|媒体/i,'媒体','Press','entries'],['ct',['contact'],/contact|联系/i,'联系','Contact','']].forEach(function(r){
  var x=loc(r[1],r[2]);if(!x){log.push('没找到「'+r[4]+'」页面，已跳过（以后可在后台新建）');return}
  if(r[5]&&(!x.p.layout||x.p.layout=='slideshow'||(r[0]=='ex'&&x.p.layout=='grid')))x.p.layout=r[5];
  if(x.s.asLink==='yes'&&(x.s.pages||[]).length===1){made[r[0]]=x.s;return}
  x.a.splice(x.a.indexOf(x.p),1);made[r[0]]={title:r[3],titleEn:r[4],status:'显示',asLink:'yes',style:{},pages:[x.p],categories:[]};log.push('「'+(x.p.title||x.p.titleEn)+'」→ 左侧单独一项 '+r[4])});
 var mv=Object.keys(made).map(function(k){return made[k]}),pro=null,txt=null,abt=null,oth=[];
 S.filter(function(s){return mv.indexOf(s)<0&&((s.pages||[]).length||(s.categories||[]).length)}).forEach(function(s){var t=(s.titleEn||'')+(s.title||'');
  if(!pro&&((s.categories||[]).length||/project|artworks?|作品/i.test(t)))pro=s;else if(!txt&&/texts?|文本/i.test(t))txt=s;else if(!abt&&/about|关于/i.test(t))abt=s;else oth.push(s)});
 function nm(s,t,e){if(s){if(!s.title)s.title=t;s.titleEn=e}}
 nm(pro,'作品','Projects');nm(txt,'文本','Texts');nm(abt,'关于','About');
 D.sections=[pro,made.ex,txt,made.pr,abt].concat(oth,[made.ct]).filter(Boolean);
 dirty=true;cur=firstPage();render();
 msg('已整理（还没发布）：'+(log.length?log.join('；')+'。':'')+'请看左边目录，满意就点「保存并发布」；不满意就刷新本页，什么都不会改动。刚才已自动下载了一份备份。')};
$('#save').onclick=save;
$('#dl').onclick=function(){commit();var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='content.json';a.click()};
$('#set').onclick=function(){$('#rp').value=C.repo||'';$('#tk').value=C.tok||'';$('#cfg').showModal()};
$('#no').onclick=function(){$('#cfg').close()};
$('#ok').onclick=function(){C={repo:$('#rp').value.replace(/\s/g,'').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),tok:$('#tk').value.replace(/[^\x21-\x7E]/g,'')};if(!/^[\w.-]+\/[\w.-]+$/.test(C.repo)){msg('仓库名格式不对，应是「用户名/仓库名」，例如 yourname/gaorongguo',1);return}try{localStorage.setItem('gh',JSON.stringify(C))}catch(e){}$('#cfg').close();load()};
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
document.execCommand('defaultParagraphSeparator',false,'p');
if(!C.tok)$('#cfg').showModal();
load();
})();
